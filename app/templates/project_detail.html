{% extends "base.html" %}
{% block content %}
<div id="header"></div>
<div class="row g-3 mt-1">
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">Schedule History (chronological)</div>
    <div class="card-body"><div class="chart-box"><canvas id="schedChart"></canvas></div>
    <div id="sched-table" class="mt-2"></div></div></div></div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">Budget History (chronological)</div>
    <div class="card-body"><div class="chart-box"><canvas id="budgChart"></canvas></div>
    <div id="budg-table" class="mt-2"></div></div></div></div>
</div>
<div class="card mt-3"><div class="card-header">Derived Execution Events (source-traceable)</div>
  <div class="card-body"><div id="timeline"></div></div></div>
<div class="mt-3">
  <a class="btn btn-primary" id="analyze-btn"><i class="bi bi-cpu"></i> Analyze in PM-RAG Workbench</a>
</div>
{% endblock %}
{% block scripts %}
<script>
const PID = {{ project_id }};
async function load() {
  const p = await api(`/api/projects/${PID}`);
  document.getElementById("header").innerHTML = `<div class="card"><div class="card-body">
    <h5>${p.name||p.project_key}</h5>
    <div class="text-muted">Key <span class="mono">${p.project_key}</span> · PID ${p.pid||'—'} · Agency ${p.managing_agency||'—'} ·
      Phase ${p.phase||'—'} · Borough ${p.borough||'—'}</div>
    <div class="mt-1">FMS IDs: ${(p.fms_ids||[]).map(f=>`<span class="badge bg-secondary mono">${f}</span>`).join(' ')||'—'}</div>
    ${p.financial_snapshot?`<div class="mt-2 small">Original budget <b>${fmt(p.financial_snapshot.original_budget)}</b> →
      current <b>${fmt(p.financial_snapshot.current_budget)}</b> (change ${fmt(p.financial_snapshot.budget_change)})
      <span class="text-muted">[${p.financial_snapshot.method}]</span></div>`:''}
    </div></div>`;
  document.getElementById("analyze-btn").href = `/rag-workbench?project_id=${PID}`;

  const sh = (await api(`/api/projects/${PID}/schedule-history`)).schedule_history;
  renderSchedule(sh);
  const bh = (await api(`/api/projects/${PID}/budget-history`)).budget_history;
  renderBudget(bh);
  const tl = (await api(`/api/projects/${PID}/timeline`)).events;
  document.getElementById("timeline").innerHTML = tl.length ? tl.map(e=>`
    <div class="evidence-item"><b>${e.event_type}</b> @ ${e.reporting_period||'—'} · value ${fmt(e.value)}
      <div class="small">${e.description||''}</div>
      <div class="small text-muted mono">method: ${e.method} · sources: ${JSON.stringify(e.source_record_ids)}</div></div>`).join("")
    : '<div class="empty-state">No derived events. Run analysis from Datasets.</div>';
}
function renderSchedule(sh){
  if(!sh.length){ document.getElementById("schedChart").parentElement.innerHTML='<div class="empty-state">No schedule history.</div>'; return; }
  const fc = sh.filter(x=>x.completion_date);
  lineChart(document.getElementById("schedChart"), fc.map(x=>x.reporting_period),
    [{label:"Completion date", data:fc.map(x=> x.completion_date? new Date(x.completion_date).getTime()/8.64e7 : null),
      borderColor:PALETTE[0], tension:.2}],
    {scales:{y:{ticks:{callback:v=> new Date(v*8.64e7).toISOString().slice(0,10)}}}});
  document.getElementById("sched-table").innerHTML = `<table class="table table-sm"><thead><tr>
    <th>Period</th><th>Completion</th><th>Type</th><th>Var(d)</th></tr></thead><tbody>
    ${sh.map(x=>`<tr><td>${x.reporting_period||''}</td><td>${x.completion_date||''}</td>
      <td><span class="badge bg-${x.completion_date_type==='Actual'?'success':'warning text-dark'}">${x.completion_date_type||''}</span></td>
      <td>${fmt(x.variance_days)}</td></tr>`).join("")}</tbody></table>`;
}
function renderBudget(bh){
  if(!bh.length){ document.getElementById("budgChart").parentElement.innerHTML='<div class="empty-state">No budget history.</div>'; return; }
  lineChart(document.getElementById("budgChart"), bh.map(x=>x.reporting_period),
    [{label:"Total budget", data:bh.map(x=>x.total_budget), borderColor:PALETTE[1], tension:.2},
     {label:"Spend", data:bh.map(x=>x.spend_to_date), borderColor:PALETTE[4], tension:.2}]);
  document.getElementById("budg-table").innerHTML = `<table class="table table-sm"><thead><tr>
    <th>Period</th><th>Budget</th><th>Spend</th><th>Variance</th></tr></thead><tbody>
    ${bh.map(x=>`<tr><td>${x.reporting_period||''}</td><td>${fmt(x.total_budget)}</td>
      <td>${fmt(x.spend_to_date)}</td><td>${fmt(x.budget_variance)}</td></tr>`).join("")}</tbody></table>`;
}
load().catch(e=>showAlert(e.message,"danger"));
</script>
{% endblock %}
